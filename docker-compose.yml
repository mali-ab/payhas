services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - backend_data:/app/data
    environment:
      DATABASE_PATH: /app/data/payhas.db
    command:
      - /bin/sh
      - -c
      - python backend/seed.py && exec uvicorn backend.main:app --host 0.0.0.0 --port 8080 --proxy-headers --no-server-header

volumes:
  backend_data:
